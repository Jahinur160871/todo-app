name: CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-artifact:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean server node_modules
        working-directory: ./server
        run: rm -rf node_modules

      - name: Install server dependencies
        working-directory: ./server
        run: npm install --include=dev

      - name: Run server tests
        working-directory: ./server
        run: npm test

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Install client dependencies
        working-directory: ./client
        run: npm install --include=dev

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          tar -czf artifacts/server-build.tar.gz -C server dist
          tar -czf artifacts/client-build.tar.gz -C client build
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
